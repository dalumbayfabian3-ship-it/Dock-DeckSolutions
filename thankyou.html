<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Thank You | Dock & Deck Solutions</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="Logo.ico">
    
    <link rel="icon" type="image/png" sizes="32x32" href="Logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Logo.png">

    <link rel="apple-touch-icon" sizes="180x180" href="Logo.png">
    <style>
        .thank-you-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            text-align: center;
            padding: 40px 20px;
        }
        .thank-you-content {
            max-width: 500px;
            width: 100%;
        }
        .check-circle {
            width: 80px;
            height: 80px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="subpage">

    <nav class="navbar navbar-scrolled">
        <div class="logo">
            <img src="Logo.png" alt="logo" class="littlelogo">
            <a href="index.html">DOCK & <span>DECK SOLUTIONS</span></a>
        </div>
        
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#services">Services</a></li>
            <li><a href="contact.html" class="primary-btn nav-cta">Get a Quote</a></li>
        </ul>
    </nav>

    <main class="thank-you-container">
        <div class="thank-you-content reveal">
            <div class="check-circle">✓</div>
            <h1 style="font-family: 'Oswald'; color: var(--primary); letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase;">Message Received</h1>
            <p style="color: #666; margin-bottom: 40px; line-height: 1.8; font-size: 1.1rem;">
                Thank you for reaching out to <strong>Dock & Deck Solutions</strong>. <br> 
                Our maritime specialists have been notified and will respond to your inquiry within 24 hours.
            </p>
            
            <a href="index.html" class="primary-btn" style="padding: 18px 60px; text-decoration: none; display: inline-block;">
                Return to Home
            </a>
        </div>
    </main>

    <footer class="main-footer" style="background: #0a2342; padding: 40px 0;">
        <p style="font-size: 0.85rem; opacity: 0.7; color: white; text-align: center;">© 2026 Dock & Deck Solutions. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
